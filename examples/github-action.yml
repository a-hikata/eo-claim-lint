# Example workflows for the eo-claim-lint GitHub Action.
#
# Copy one of these into .github/workflows/ in the repository whose claim
# documents you want to check.
#
# `@v0` is a moving tag that always points at the newest v0.x.y. Pin to
# `@v0.1.0` or to a commit SHA if you need a reproducible build.

# ---------------------------------------------------------------------------
# Minimal: check every claim document on a pull request.
# ---------------------------------------------------------------------------
name: Claim documents

on:
  pull_request:

permissions:
  contents: read # the action needs nothing else

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: a-hikata/eo-claim-lint@v0
        with:
          files: claims/*.json
