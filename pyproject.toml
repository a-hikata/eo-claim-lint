[build-system]
requires = ["hatchling>=1.21,<2"]
build-backend = "hatchling.build"

[project]
name = "eo-claim-lint"
version = "0.1.1"
description = "A linter for checking whether Earth observation claims distinguish measurements, estimates, uncertainty, and supporting evidence."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Takahito Suzuki" }]
keywords = [
    "earth-observation",
    "remote-sensing",
    "linter",
    "provenance",
    "uncertainty",
    "data-quality",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]

# Runtime dependencies are intentionally empty. TOML parsing will use the
# standard-library `tomllib` (Python 3.11+). No dependency is added before the
# feature that needs it exists.
dependencies = []

[project.scripts]
eo-claim-lint = "eo_claim_lint.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "build>=1.2",
    "twine>=5.1",
    # Used only to check the bundled schemas in tests. The package itself never
    # validates against a schema at runtime, so this stays out of `dependencies`.
    "jsonschema>=4.23",
    # jsonschema ships no py.typed marker, so its types come from a stub package
    # rather than from a blanket mypy exemption.
    "types-jsonschema>=4.23",
    # Used only to validate action.yml and the workflows in tests. YAML has no
    # standard-library parser, and hand-rolling one to check our own metadata
    # would be less trustworthy than the reference implementation.
    "PyYAML>=6.0",
    "types-PyYAML>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/eo_claim_lint"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/action",
    "/action.yml",
    "/examples",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"

[tool.coverage.run]
branch = true
source = ["eo_claim_lint"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 100
src = ["src", "tests", "action"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
# `action` is repository infrastructure that lives outside src/, so isort has
# to be told it is ours rather than a third-party package.
known-first-party = ["eo_claim_lint", "action", "tests"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests", "action"]
strict = true
warn_unused_configs = true
