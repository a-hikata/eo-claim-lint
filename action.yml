name: "EO Claim Lint"
description: "Lint Earth observation claim documents for uncertainty, evidence, provenance, and display consistency."
author: "Takahito Suzuki"

branding:
  icon: "check-circle"
  color: "blue"

inputs:
  files:
    description: "Claim documents to check. One path or glob per line. Globs are not recursive."
    required: true
  fail-on:
    description: "Lowest severity that fails the step: error, warning, or info."
    required: false
    default: "error"
  enable:
    description: "Run only these rules. One rule id per line. Empty means every rule."
    required: false
    default: ""
  disable:
    description: "Skip these rules. One rule id per line."
    required: false
    default: ""
  severity:
    description: "Severity overrides, one RULE_ID=SEVERITY per line."
    required: false
    default: ""
  python-version:
    description: "Python version used to run the linter."
    required: false
    default: "3.11"
  working-directory:
    description: "Directory the file patterns are resolved against. Must stay inside the workspace."
    required: false
    default: "."

outputs:
  exit-code:
    description: "The linter's own exit status: 0 passed, 1 lint failure, 2 usage error, 3 internal error."
    value: ${{ steps.eo-claim-lint.outputs.exit-code }}
  outcome:
    description: "The exit status as a name: passed, lint-failed, usage-error, or internal-error."
    value: ${{ steps.eo-claim-lint.outputs.outcome }}

runs:
  using: composite
  steps:
    # actions/setup-python v5, pinned to a commit so that a tag move cannot
    # change what runs in someone else's workflow.
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: ${{ inputs.python-version }}

    # Installed from the action's own checkout, never from a package index, so
    # the code that runs is the code that was reviewed at this ref.
    - name: Install eo-claim-lint
      shell: bash
      run: python -m pip install --disable-pip-version-check "$GITHUB_ACTION_PATH"

    # Every input is passed through the environment rather than interpolated
    # into this script. `${{ inputs.files }}` written into a run block would
    # hand the caller a shell; an environment variable does not.
    - name: Run eo-claim-lint
      id: eo-claim-lint
      shell: bash
      env:
        INPUT_FILES: ${{ inputs.files }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_ENABLE: ${{ inputs.enable }}
        INPUT_DISABLE: ${{ inputs.disable }}
        INPUT_SEVERITY: ${{ inputs.severity }}
        INPUT_WORKING_DIRECTORY: ${{ inputs.working-directory }}
      run: python "$GITHUB_ACTION_PATH/action/run.py"
